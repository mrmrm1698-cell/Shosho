<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shosho Birthday ❤</title>
    <style>
        * { box-sizing: border-box; }
        body {
            /* خلفية بيضاء ناصعة وناعمة */
            background: linear-gradient(135deg, #ffffff, #fce4ec, #f8bbd0);
            color: #4a235a;
            font-family: 'Tahoma', sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* حاوية القلوب البيضاء المتحركة */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }
        .heart {
            position: absolute;
            top: -10vh;
            color: rgba(255, 255, 255, 0.85); /* قلوب بيضاء ناعمة */
            text-shadow: 0 0 5px rgba(255, 64, 129, 0.3);
            font-size: 22px;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        #lock-screen, .card {
            z-index: 2;
            position: relative;
        }

        /* شاشة كلمة السر بتصميم أبيض فخم */
        #lock-screen {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            padding: 40px 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(233, 30, 99, 0.15);
            max-width: 380px;
            width: 100%;
            border: 1px solid rgba(255, 64, 129, 0.2);
        }
        #lock-screen input {
            width: 85%;
            padding: 14px;
            margin-top: 20px;
            border-radius: 25px;
            border: 1px solid #f8bbd0;
            text-align: center;
            font-size: 16px;
            outline: none;
            background: #fff;
            color: #333;
        }
        #lock-screen button {
            margin-top: 20px;
            background: linear-gradient(135deg, #ff4081, #e91e63);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(233, 30, 99, 0.3);
        }

        /* الكارت الرئيسي */
        .card {
            display: none;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            padding: 35px 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(233, 30, 99, 0.15);
            max-width: 460px;
            width: 100%;
            border: 1px solid rgba(255, 64, 129, 0.2);
            margin-bottom: 70px;
        }
        h1 {
            color: #d81b60;
            font-size: 26px;
            margin-bottom: 15px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.05);
        }
        .photo-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #ff4081;
            box-shadow: 0 8px 20px rgba(255, 64, 129, 0.3);
            background: #fff;
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* تصميم عداد شيك وجميل */
        .counter {
            font-size: 14px;
            color: #880e4f;
            margin-bottom: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #fff0f3, #ffebee);
            padding: 15px;
            border-radius: 20px;
            border: 1px solid #f8bbd0;
            box-shadow: inset 0 2px 5px rgba(255, 64, 129, 0.05);
            line-height: 1.6;
        }

        /* صندوق الكتابة */
        .typing-box {
            font-size: 15px;
            line-height: 1.9;
            text-align: right;
            white-space: pre-wrap;
            color: #4a235a;
            min-height: 180px;
            max-height: 250px;
            overflow-y: auto;
            background: #fff5f8;
            padding: 18px;
            border-radius: 20px;
            border-right: 4px solid #ff4081;
            border-top: 1px solid #ffebee;
            border-left: 1px solid #ffebee;
            border-bottom: 1px solid #ffebee;
        }
    </style>
</head>
<body>

    <!-- القلوب البيضاء في الخلفية -->
    <div class="hearts-container" id="hearts-container"></div>

    <div id="lock-screen">
        <h2>🔒 أدخلي كلمة السر</h2>
        <p style="font-size: 13px; margin-top: 8px; color: #666;">اكتبي اسم "شهد" عشان الصفحة تفتح</p>
        <input type="password" id="password-input" placeholder="كلمة السر...">
        <br>
        <button onclick="checkPassword()">دخول ❤</button>
    </div>

    <div class="card" id="main-content">
        <div class="photo-container">
            <img src="Snapchat-1051083468.jpg" alt="Shosho">
        </div>

        <h1>عيد ميلاد سعيد يا شهد! 🎉</h1>
        
        <div class="counter" id="time-counter">⏳ جاري حساب اللحظات...</div>

        <div class="typing-box" id="typed-message"></div>
    </div>

    <audio id="bgSong" src="song.mp3" preload="auto" loop></audio>

    <button id="play-btn" onclick="playAudio()" style="display:none; position:fixed; bottom:25px; left:50%; transform:translateX(-50%); z-index:99999; background:linear-gradient(135deg, #ff4081, #e91e63); color:white; padding:12px 28px; border:none; border-radius:30px; font-weight:bold; font-size:16px; cursor:pointer; box-shadow: 0 5px 20px rgba(233, 30, 99, 0.4);">تشغيل الأغنية 🎵</button>

    <script>
        function createHeart() {
            const container = document.getElementById('hearts-container');
            if (!container) return;
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '🤍'; // قلوب بيضاء
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            heart.style.fontSize = (Math.random() * 15 + 16) + 'px';
            container.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
        setInterval(createHeart, 250);

        const messageText = "كل سنه وانتي طيبه يعمري وعقبال مليون سنه حلوه ويارب نعقل ونخف العبط ده شويه ماشي 😂\n\nمش فاهمه انا كبرتي ازاي يعني بسرعه كده أن عقلك اصغر من سنك اصلا 😂 عارفه هزعلك انتي والله علي اللي بتعملي ده بس ربنا يصلح حالك والله يعني 😂♥️\n\nالمهم بقي 😂\n\nكل سنه وانتي معايا ودايما مع بعض كده اه بقينا بعيد شويه عن بعض بس غلاوتك هتفضل زي ما هي عندي انتي عشرت سنين مش يوم ولا اتنين وهتفضلي اغلي واحده عندي مهما حصل بينا اصلا ويارب تكون سنه مليانه تعويضات وربنا يبعد عنك اي حاجه وحشه واي حد وحش ويفرح قلبك ب اللي انتي بتتمني يارب واشوفك احلي عروسه في الدنيا دي كلها كل سنه وانتي معايا يعمري 🌚🫂♥️♥️♥️";

        function checkPassword() {
            var pass = document.getElementById("password-input").value.trim();
            if (pass === "شهد") {
                document.getElementById("lock-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
                document.getElementById("play-btn").style.display = "block";
                startCounter();
                startTyping();
            } else {
                alert("كلمة السر غلط يا مارينا، اكتبي 'شهد' صح!");
            }
        }

        function startCounter() {
            const startDate = new Date("2023-01-01T00:00:00");
            setInterval(() => {
                const now = new Date();
                const diff = now - startDate;
                const seconds = Math.floor(diff / 1000) % 60;
                const minutes = Math.floor(diff / (1000 * 60)) % 60;
                const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const years = Math.floor(days / 365);
                const remainingDays = days % 365;
                
                document.getElementById("time-counter").innerHTML = 
                    `✨ مع بعض من سنة 2023 ✨<br>` +
                    `<span style="color:#d81b60; font-size:13px; font-weight:bold;">${years} سنة، ${remainingDays} يوم، ${hours} ساعة، ${minutes} دقيقة، ${seconds} ثانية 🤍</span>`;
            }, 1000);
        }

        let i = 0;
        function startTyping() {
            if (i < messageText.length) {
                document.getElementById("typed-message").innerHTML += messageText.charAt(i);
                i++;
                setTimeout(startTyping, 25);
            }
        }

        function playAudio() {
            var audio = document.getElementById("bgSong");
            audio.play().then(() => {
                document.getElementById("play-btn").style.display = "none";
            }).catch(error => {
                alert("اضغطي كمان مرة عشان الأغنية تشتغل!");
            });
        }
    </script>
</body>
</html>
