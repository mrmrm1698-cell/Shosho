<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shosho Birthday ❤️️</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0b0914, #1f1435, #2d1b4e);
            color: #ffffff;
            font-family: 'Tahoma', sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        /* شاشة كلمة السر الفخمة */
        #lock-screen {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            padding: 40px 25px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            max-width: 380px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        #lock-screen input {
            width: 85%;
            padding: 14px;
            margin-top: 20px;
            border-radius: 25px;
            border: none;
            text-align: center;
            font-size: 16px;
            outline: none;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
        }
        #lock-screen button {
            margin-top: 20px;
            background: linear-gradient(135deg, #ff4081, #ff7eb3);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 64, 129, 0.5);
            transition: 0.3s;
        }
        #lock-screen button:hover { transform: scale(1.05); }

        /* محتوى الموقع الأساسي */
        .card {
            display: none;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            padding: 35px 25px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            max-width: 460px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 70px;
        }
        h1 {
            color: #ff7eb3;
            font-size: 26px;
            margin-bottom: 15px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .photo-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #ff4081;
            box-shadow: 0 8px 25px rgba(255, 64, 129, 0.6);
            background: #111;
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .counter {
            font-size: 14px;
            color: #ffeb3b;
            margin-bottom: 20px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.35);
            padding: 12px;
            border-radius: 15px;
            border: 1px solid rgba(255, 235, 59, 0.3);
        }
        .typing-box {
            font-size: 15px;
            line-height: 1.9;
            text-align: right;
            white-space: pre-wrap;
            color: #fce4ec;
            min-height: 180px;
            background: rgba(0, 0, 0, 0.2);
            padding: 18px;
            border-radius: 20px;
            border-right: 4px solid #ff4081;
        }
    </style>
</head>
<body>

    <!-- شاشة كلمة السر -->
    <div id="lock-screen">
        <h2>🔒 أدخلي كلمة السر</h2>
        <p style="font-size: 13px; margin-top: 8px; color: #ddd;">اكتبي اسم "شهد" عشان الصفحة تفتح</p>
        <input type="password" id="password-input" placeholder="كلمة السر...">
        <br>
        <button onclick="checkPassword()">دخول ❤</button>
    </div>

    <!-- محتوى الموقع -->
    <div class="card" id="main-content">
        <div class="photo-container">
            <!-- استخدام اسم الصورة الذي أرسلتيه وتأكيد عملها بشكل مباشر -->
            <img src="1002467196.jpg" alt="Shosho" onerror="this.onerror=null; this.src='photo.jpg';">
        </div>

        <h1>عيد ميلاد سعيد يا شهد! 🎉</h1>
        
        <div class="counter" id="time-counter">⏳ جاري حساب الذكريات...</div>

        <div class="typing-box" id="typed-message"></div>
    </div>

    <audio id="bgSong" src="song.mp3" preload="auto" loop></audio>

    <button id="play-btn" onclick="playAudio()" style="display:none; position:fixed; bottom:25px; left:50%; transform:translateX(-50%); z-index:99999; background:linear-gradient(135deg, #ff4081, #ff7eb3); color:white; padding:12px 28px; border:none; border-radius:30px; font-weight:bold; font-size:16px; cursor:pointer; box-shadow: 0 5px 20px rgba(0,0,0,0.5);">تشغيل الأغنية 🎵</button>

    <script>
        const messageText = `كل سنه وانتي طيبه يعمري وعقبال مليون سنه حلوه ويارب نعقل ونخف العبط ده شويه ماشي 😂 
مش فاهمه انا كبرتي ازاي يعني بسرعه كده أن عقلك اصغر من سنك اصلا 😂 عارفه هزعلك انتي والله علي اللي بتعملي ده بس ربنا يصلح حالك والله يعني 😂♥️ 
المهم بقي 😂 
كل سنه وانتي معايا ودايما مع بعض كده اه بقينا بعيد شويه عن بعض بس غلاوتك هتفضل زي ما هي عندي انتي عشرت سنين مش يوم ولا اتنين وهتفضلي اغلي واحده عندي مهما حصل بينا اصلا ويارب تكون سنه مليانه تعويضات وربنا يبعد عنك اي حاجه وحشه واي حد وحش ويفرح قلبك ب اللي انتي بتتمني يارب واشوفك احلي عروسه في الدنيا دي كلها كل سنه وانتي معايا يعمري 🌚🫂♥️♥️♥️`;

        function checkPassword() {
            var pass = document.getElementById("password-input").value.trim();
            if (pass === "شهد") {
                document.getElementById("lock-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
                document.getElementById("play-btn").style.display = "block";
                startCounter();
                startTyping();
            } else {
                alert("كلمة السر غلط يا مارينا، اكتبي 'شهد' صح!");
            }
        }

        function startCounter() {
            const startDate = new Date("2023-01-01T00:00:00");
            setInterval(() => {
                const now = new Date();
                const diff = now - startDate;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const years = Math.floor(days / 365);
                const remainingDays = days % 365;
                
                document.getElementById("time-counter").innerHTML = `⏳ مع بعض من سنة 2023 (${years} سنة و ${remainingDays} يوم حب وعِشرة ❤️)`;
            }, 1000);
        }

        let i = 0;
        function startTyping() {
            if (i < messageText.length) {
                document.getElementById("typed-message").innerHTML += messageText.charAt(i);
                i++;
                setTimeout(startTyping, 30);
            }
        }

        function playAudio() {
            var audio = document.getElementById("bgSong");
            audio.play().then(() => {
                document.getElementById("play-btn").style.display = "none";
            }).catch(error => {
                alert("اضغطي كمان مرة عشان الأغنية تشتغل!");
            });
        }
    </script>
</body>
</html>
