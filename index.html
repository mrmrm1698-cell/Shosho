<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد ميلاد سعيد يا شهد 🎉🎂</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background-color: #fff0f5; 
            color: #333; 
            text-align: center; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: flex-start; 
            padding: 20px 15px 50px 15px; 
            position: relative;
            overflow-x: hidden;
        }

        .balloon-bg {
            position: fixed;
            top: -20px;
            font-size: 20px;
            animation: fall 7s linear infinite;
            z-index: 1;
            pointer-events: none;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        .login-card { 
            background: #ffffff; 
            padding: 30px 25px; 
            border-radius: 25px; 
            width: 100%; 
            max-width: 350px; 
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.2); 
            border: 2px dashed #ff69b4;
            position: relative;
            z-index: 10;
            margin: auto;
        }
        .login-card h1 { color: #d81b60; font-size: 22px; margin-bottom: 15px; }
        input { 
            width: 100%; 
            padding: 14px; 
            margin: 15px 0; 
            border-radius: 15px; 
            border: 1.5px solid #ff85a1; 
            background: #fff0f3; 
            color: #d81b60; 
            text-align: center; 
            font-size: 16px; 
            outline: none;
            font-weight: bold;
        }
        .btn-main { 
            background: #e91e63; 
            color: #fff; 
            border: none; 
            padding: 15px 30px; 
            border-radius: 50px; 
            font-size: 18px; 
            font-weight: bold; 
            width: 100%; 
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(233, 30, 99, 0.3);
            transition: transform 0.2s;
        }
        .btn-main:active { transform: scale(0.97); }

        .hidden { display: none !important; }

        .main-container {
            width: 100%;
            max-width: 380px;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .main-title {
            color: #d81b60;
            font-size: 32px;
            font-weight: 900;
            margin: 5px 0;
        }

        .photo-frame {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #ff69b4;
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.3);
            margin: 5px auto;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .photo-frame:hover { transform: scale(1.05); }
        .photo-frame img { width: 100%; height: 100%; object-fit: cover; }

        .timer-container {
            background: #ffffff;
            border: 2px dashed #ff69b4;
            border-radius: 20px;
            padding: 20px 10px;
            width: 100%;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.15);
        }
        .timer-title { color: #c2185b; font-size: 16px; font-weight: bold; margin-bottom: 15px; }
        .timer-grid { display: flex; justify-content: space-around; gap: 8px; }
        .time-box {
            background: #fff0f3;
            border-radius: 16px;
            padding: 12px 5px;
            flex: 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .time-number { color: #e91e63; font-size: 26px; font-weight: 800; line-height: 1; margin-bottom: 6px; }
        .time-label { color: #666; font-size: 13px; font-weight: 500; }

        .surprise-card {
            background: #ffffff;
            border: 2px dashed #ff69b4;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.15);
            margin-top: 5px;
        }
        .typing-text { 
            font-size: 15px; 
            color: #c2185b; 
            font-weight: bold;
            line-height: 1.9;
            text-align: right;
            white-space: pre-line;
        }
        .gift-box {
            font-size: 50px;
            margin-top: 5px;
            cursor: pointer;
            animation: pulse 1.5s infinite;
            display: inline-block;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }
        .music-pill {
            position: fixed;
            bottom: 25px;
            right: 20px;
            background: #ffffff;
            padding: 8px 15px 8px 10px;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
            cursor: pointer;
            border: 1px solid #ffe6eb;
        }
        .music-btn {
            width: 32px;
            height: 32px;
            background: #e91e63;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }
        .music-text { color: #e91e63; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-card" id="loginCard">
    <h1>أدخل كلمة السر يا شهد 🎂</h1>
    <input type="password" id="passInput" placeholder="اكتبي الباسورد هنا (شهد)...">
    <button class="btn-main" onclick="checkPass()">دخول 🎉</button>
</div>

<div class="main-container hidden" id="mainCard">
    <div class="main-title">كل سنة وأنتِ جنبي ❤️</div>

    <div class="photo-frame" onclick="showMainSurprise()" title="اضغطي هنا لتشوفي الرسالة!">
        <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=500&auto=format&fit=crop&q=60" alt="صورة">
    </div>
    <div style="font-size: 13px; color: #d81b60; font-weight: bold; cursor: pointer;" onclick="showMainSurprise()">
        (اضغطي على الصورة عشان تظهر الرسالة 👆)
    </div>

    <div class="timer-container">
        <div class="timer-title">✨ أحلى صحاب مع بعض من سنة 2023:</div>
        <div class="timer-grid">
            <div class="time-box"><div class="time-number" id="days">0</div><div class="time-label">يوم</div></div>
            <div class="time-box"><div class="time-number" id="hours">0</div><div class="time-label">ساعة</div></div>
            <div class="time-box"><div class="time-number" id="minutes">0</div><div class="time-label">دقيقة</div></div>
            <div class="time-box"><div class="time-number" id="seconds">0</div><div class="time-label">ثانية</div></div>
        </div>
    </div>

    <div style="margin-top: 5px;">
        <div class="gift-box" onclick="showMainSurprise()">🎉</div>
        <div style="font-size: 13px; color: #e91e63; font-weight: bold;">كل سنة وأنتِ أطيب قلب 🎂👇</div>
    </div>

    <div class="surprise-card hidden" id="surpriseCard">
        <div class="typing-text" id="typewriter"></div>
    </div>
</div>

<div class="music-pill hidden" id="musicPill" onclick="toggleMusic()">
    <span class="music-text">🎶 كل سنة وأنت جنبي</span>
    <div class="music-btn" id="musicIcon">⏸</div>
</div>

<!-- أغنية هادئة وجميلة تشتغل في الخلفية تلقائياً بعد إدخال الباسورد -->
<audio id="bgSong" src="https://www.bensound.com/bensound-music/bensound-cute.mp3" loop></audio>

<script>
    function createBalloons() {
        const symbols = ['🎈', '💖', '✨', '🌸', '🎁', '🎂'];
        setInterval(() => {
            const balloon = document.createElement('div');
            balloon.classList.add('balloon-bg');
            balloon.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            balloon.style.left = Math.random() * 100 + 'vw';
            balloon.style.animationDuration = (Math.random() * 3 + 5) + 's';
            document.body.appendChild(balloon);
            setTimeout(() => balloon.remove(), 7000);
        }, 400);
    }
    createBalloons();

    const textToType = "كل سنه وانتي طيبه يعمري وعقبال مليون سنه حلوه ويارب نعقل ونخف العبط ده شويه ماشي 😂 \n\nمش فاهمه انا كبرتي ازاي يعني بسرعه كده أن عقلك اصغر من سنك اصلا 😂 عارفه هزعلك انتي والله علي اللي بتعملي ده بس ربنا يصلح حالك والله يعني 😂♥️ \n\nالمهم بقي 😂 \n\nكل سنه وانتي معايا ودايما مع بعض كده اه بقينا بعيد شويه عن بعض بس غلاوتك هتفضل زي ما هي عندي انتي عشرت سنين مش يوم ولا اتنين وهتفضلي اغلي واحده عندي مهما حصل بينا اصلا ويارب تكون سنه مليانه تعويضات وربنا يبعد عنك اي حاجه وحشه واي حد وحش ويفرح قلبك ب اللي انتي بتتمني يارب واشوفك احلي عروسه في الدنيا دي كلها كل سنه وانتي معايا يعمري 🌚🫂♥️♥️♥";
    let index = 0;
    let isTyping = false;

    function typeWriter() {
        if (index < textToType.length) {
            document.getElementById("typewriter").innerHTML += textToType.charAt(index);
            index++;
            setTimeout(typeWriter, 30);
        }
    }

    function checkPass() {
        const pass = document.getElementById('passInput').value.trim();
        if(pass === 'شهد') {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('mainCard').classList.remove('hidden');
            document.getElementById('musicPill').classList.remove('hidden');
            
            const song = document.getElementById('bgSong');
            song.play().catch(() => {});
            startTimer();
        } else {
            alert('الباسورد خطأ يا قمر! اكتبي "شهد" صح.');
        }
    }

    function toggleMusic() {
        const song = document.getElementById('bgSong');
        const icon = document.getElementById('musicIcon');
        if (song.paused) {
            song.play();
            icon.innerText = '⏸';
        } else {
            song.pause();
            icon.innerText = '▶';
        }
    }

    function startTimer() {
        const startDate = new Date('2023-01-01T00:00:00');
        setInterval(() => {
            const now = new Date();
            const diff = now - startDate;
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours;
            document.getElementById('minutes').innerText = minutes;
            document.getElementById('seconds').innerText = seconds;
        }, 1000);
    }

    function showMainSurprise() {
        const surpriseCard = document.getElementById('surpriseCard');
        surpriseCard.classList.remove('hidden');
        
        if (!isTyping) {
            isTyping = true;
            document.getElementById("typewriter").innerHTML = "";
            index = 0;
            typeWriter();
        }
        surpriseCard.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
