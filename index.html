<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shosho Birthday</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        h1 {
            color: #ff4081;
            font-size: 28px;
            margin-bottom: 20px;
        }
        .card {
            background: #2c2c2c;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            max-width: 400px;
            margin: auto;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>عيد ميلاد سعيد يا شهد! 🎉</h1>
        <p>كل سنة وانتِ طيبة وبخير يا رب ❤️</p>
    </div>

    <!-- عنصر الصوت -->
    <audio id="bgSong" src="song.mp3" preload="auto" loop></audio>

    <!-- زرار التشغيل -->
    <button onclick="playAudio()" style="position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:99999; background:#ff4081; color:white; padding:15px 30px; border:none; border-radius:30px; font-weight:bold; font-size:18px; cursor:pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4);">تشغيل الأغنية 🎵</button>

    <script>
    function playAudio() {
        var audio = document.getElementById("bgSong");
        audio.play().then(() => {
            console.log("Audio playing successfully");
        }).catch(error => {
            alert("اضغطي كمان مرة يا مارينا عشان تشتغل!");
        });
    }
    </script>

</body>
</html>
