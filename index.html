<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shosho Birthday</title>
    <style>
        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #ffffff;
            font-family: 'Tahoma', sans-serif;
            text-align: center;
            padding: 30px 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            color: #ff4081;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .date {
            font-size: 16px;
            color: #ffeb3b;
            margin-bottom: 20px;
            font-weight: bold;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .photo-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ff4081;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- مكان الصورة -->
        <div class="photo-container">
            <img src="photo.jpg" alt="Shosho">
        </div>

        <h1>عيد ميلاد سعيد يا شهد! 🎉</h1>
        <div class="date">📅 (اكتبي التاريخ هنا)</div>
        <p>كل سنة وانتِ طيبة وبخير يا رب، ودايماً منورة حياتنا ومحقق كل اللي بتمنيه ❤️</p>
    </div>

    <!-- عنصر الصوت والأغنية -->
    <audio id="bgSong" src="song.mp3" preload="auto" loop></audio>

    <!-- زرار التشغيل -->
    <button onclick="playAudio()" style="position:fixed; bottom:25px; left:50%; transform:translateX(-50%); z-index:99999; background:#ff4081; color:white; padding:14px 28px; border:none; border-radius:30px; font-weight:bold; font-size:17px; cursor:pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4);">تشغيل الأغنية 🎵</button>

    <script>
    function playAudio() {
        var audio = document.getElementById("bgSong");
        audio.play().then(() => {
            console.log("Playing");
        }).catch(error => {
            alert("اضغطي كمان مرة عشان الأغنية تشتغل!");
        });
    }
    </script>

</body>
</html>
