<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد ميلاد سعيد يا شهد</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: #ffffff;
            font-family: 'Tahoma', sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .birthday-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }
        h1 {
            color: #fff;
            font-size: 32px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        p {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <div class="birthday-card">
        <h1>🎉 عيد ميلاد سعيد يا شهد! 🎂</h1>
        <p>كل سنة وانتِ طيبة وبخير يا رب، ويارب تكون سنة سعيدة وفرحة مليانة لياكِ ❤️</p>
    </div>

    <!-- عنصر الصوت -->
    <audio id="bgSong" src="song.mp3" preload="auto" loop></audio>

    <!-- زرار تشغيل الأغنية -->
    <button onclick="playAudio()" style="position:fixed; bottom:25px; left:50%; transform:translateX(-50%); z-index:99999; background:#ffffff; color:#ff4081; padding:15px 30px; border:none; border-radius:30px; font-weight:bold; font-size:18px; cursor:pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">تشغيل الأغنية 🎵</button>

    <script>
    function playAudio() {
        var audio = document.getElementById("bgSong");
        audio.play().then(() => {
            console.log("Playing");
        }).catch(error => {
            alert("اضغطي كمان مرة عشان تشتغل!");
        });
    }
    </script>

</body>
</html>
